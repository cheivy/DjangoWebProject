<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简繁双向转换</title>
    <link rel="icon" href="data:,"> <!--设置浏览器小标签-->
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; }
        .container { width: 700px; margin: 30px auto; }
        textarea { width: 100%; height: 160px; padding: 10px; font-size: 16px; }
        .radio-box { margin: 15px 0; font-size: 17px; }
        .radio-box label { margin-right: 24px; cursor: pointer; }
        button { padding: 8px 20px; font-size: 16px; cursor: pointer; }
        button:disabled { opacity: .6; cursor: not-allowed; }
        {#.err { color: red; min-height: 1.2em; }#}
        .result {
            margin-top: 15px; padding: 12px; border: 1px solid #ccc;
            min-height: 80px; font-size: 16px;
            white-space: pre-wrap; word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>中文简繁双向转换工具</h1>

        <textarea id="inputText" placeholder="请输入要转换的文字"></textarea>

        <div class="radio-box">
            <label>
                <input type="radio" name="mode" value="s2t" checked> 简体 -> 繁体
            </label>
            <label>
                <input type="radio" name="mode" value="t2s"> 繁体 -> 简体
            </label>
        </div>

        <div style="display:flex; gap:10px;">
            <button id="convertBtn" type="button">开始转换</button>
            <button type="button" onclick="window.location.href='/convert1/history'">历史记录</button>
        </div>


        <div>
            <h2>转换结果：</h2>
            <div id="outputText" class="result"></div>
        </div>
    </div>

    <script>
        (function () {
            // 用 Django 反向解析出真正的 API 地址（对应 convert_text 视图）
            const API = "{% url 'convert' %}";

            const $input  = document.getElementById('inputText');
            const $output = document.getElementById('outputText');
            {#const $err    = document.getElementById('errMsg');#}
            const $btn    = document.getElementById('convertBtn');

            const reg = /^[\u4e00-\u9fa5]+$/;

            async function doConvert() {
                {#$err.textContent = '';#}

                if (!$input.value.trim()) {
                    {#$err.textContent = '请输入待转换文本！';#}
                    alert("请输入待转换文本");
                    $input.focus();
                    return;
                }

                if(!reg.test($input.value.trim())) {
                    alert("只能输入汉字");
                    $input.focus();
                    return;
                }
                const mode = document.querySelector('input[name="mode"]:checked').value;
                const params = new URLSearchParams({ text: $input.value, mode: mode });

                $btn.disabled = true;
                try {
                    const resp = await fetch(`${API}?${params}`);
                    const data = await resp.json();
                    if (data.code === 200) {
                        $output.textContent = data.result;
                    } else {
                        $err.textContent = data.msg || '转换失败';
                    }
                } catch (e) {
                    $err.textContent = '请求后端失败：' + e.message;
                    console.error(e);
                } finally {
                    $btn.disabled = false;
                }
            }

            $btn.addEventListener('click', doConvert);

            $input.addEventListener('keydown', function (e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') doConvert();
            });
        })();
    </script>
</body>
</html>
